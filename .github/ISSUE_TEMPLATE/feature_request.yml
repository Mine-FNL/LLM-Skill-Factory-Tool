name: Feature request
description: Suggest a new feature or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, please skim [CHANGELOG.md](../blob/main/CHANGELOG.md) and
        [ARCHITECTURE.md](../blob/main/ARCHITECTURE.md) — what's already there,
        what's on the deferred roadmap, and where the seam is. If your request
        fits the "north star" (prove your skill makes the model better), it
        will get more attention.

  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: e.g. "Distribution CLI: install a skill into ~/.claude/skills/"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: What's the problem?
      placeholder: |
        Describe the user pain. Who is affected and how often?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: |
        What should the behaviour look like? If you can, sketch the API surface
        (CLI flag, Python function, YAML key, etc.).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: |
        What else did you think about, and why didn't it work?

  - type: textarea
    id: willing
    attributes:
      label: Are you willing to open a PR?
      placeholder: |
        Yes / No / Maybe — even a draft PR with a failing test helps.
