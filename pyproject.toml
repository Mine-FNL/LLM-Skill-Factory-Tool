[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-skill-factory"
version = "0.4.0"
description = "Domain-agnostic SKILL.md studio with a built-in eval harness — author, validate, version, and measure the lift of modular AI-expertise skills with bootstrap 95% confidence intervals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mine-FNL" }]
keywords = [
    "llm",
    "prompts",
    "skill",
    "skill-md",
    "streamlit",
    "openrouter",
    "anthropic",
    "openai",
    "moonshot",
    "kimi",
    "eval",
    "bootstrap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.36",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    # pypdf is optional; the app degrades gracefully when missing.
    # Listed here as a recommendation only — install manually if needed.
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/Mine-FNL/LLM-Skill-Factory-Tool"
Issues = "https://github.com/Mine-FNL/LLM-Skill-Factory-Tool/issues"

[project.scripts]
skill-factory = "skill_factory.__main__:main"

# ---------------------------------------------------------------------------
# Setuptools package discovery (the core package is `skill_factory/`).
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skill_factory*"]
exclude = ["tests*", "examples*", "presets*"]

[tool.setuptools.package-data]
skill_factory = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter. Source: https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "skills"]

[tool.ruff.lint]
# A practical default: rules that catch real bugs and obvious smells.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes (unused, undefined, etc.)
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade (modern syntax)
    "SIM",       # simplify
    "C4",        # comprehensions
    "PTH",       # pathlib
    "RUF",       # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # function-call-in-default-arg is fine for FastAPI/Streamlit patterns
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to be a bit looser.
"tests/**/*.py" = ["E402", "B011"]
# CLI entrypoints import from package internals; F401 is fine if __all__ is set elsewhere.
"skill_factory/__main__.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["skill_factory", "ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    # The OpenAI SDK emits a DeprecationWarning for a few pydantic fields we don't touch.
    "ignore::DeprecationWarning:openai.*",
    "ignore::DeprecationWarning:pydantic.*",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["skill_factory"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = false
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["skill_factory"]
omit = ["skill_factory/__main__.py", "skill_factory/healthcheck.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 60
